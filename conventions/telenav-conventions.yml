generated: '2026-07-21'
method: searched
source: https://docs.telenav.com/entity-rest/common.html
notes: >-
  Cross-cutting request/response semantics of the Telenav Entity Service
  REST API, captured from docs.telenav.com (no OpenAPI is published).
authentication:
  style: api-key-plus-request-signature
