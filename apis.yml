aid: telenav
name: Telenav
description: >-
  Telenav is a connected-car and location-based services company that powers
  in-vehicle navigation (VIVID NAV), infotainment (VIVID IVI), and in-car
  commerce (VIVID COMMERCE) for automotive partners including Daimler, Ford,
  GM, Toyota, and Xpeng. Its developer surface centers on the Entity Service
  REST API for location-aware semantic search, auto-suggest predictions,
  entity detail lookup, and discovery including EV charge-station search,
  alongside partner-distributed navigation and driver-intelligence SDKs
  documented at docs.telenav.com and open-source Java tooling on Maven
  Central.
