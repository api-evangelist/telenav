apis:
- name: Telenav Entity Service REST API
  description: >-
    Location-based semantic search for the connected car - onebox search
    with category, brand, corridor, polygon, and bounding-box filters,
    reverse geocoding, EV charge-station search, auto-suggest and word
    prediction, entity detail lookup (batch supported), and discovery of
    places, brands, and categories. JSON over REST, versioned under /v5/,
    authenticated with a Telenav-assigned API key plus per-request SHA-256
    signature. API hosts are provisioned per automotive partner and are not
    published publicly (docs reference a {host} placeholder).
  humanURL: https://docs.telenav.com/overview/entity-rest.html
