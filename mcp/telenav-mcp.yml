- name: predict_words
  description: Word prediction for query composition.
  source_operation: https://docs.telenav.com/entity-rest/prediction.html (POST /v5/prediction/word/json)
- name: get_entity_details
  description: Retrieve detailed information for one or more entity IDs (batch supported).
